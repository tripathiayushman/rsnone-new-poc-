<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSN ONE — C31 Add / Edit Address</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   RSN ONE — C31 Add / Edit Address
   Source mock: rsn-one-design/C31-AddEditAddress.png  (853 x 1844, 1x)
   Authored 1:1 with the mock. Every value here is the pixel value measured
   in the PNG — no scaling. To preview at phone size: .screen{zoom:.5}
   Tokens + base components are IDENTICAL in every CXX file; see
   RSN-HANDOFF-SPEC.md. Screen-specific CSS starts at "SCREEN: ADD ADDRESS".
   ========================================================================== */

/* ---------- 1. TOKENS ---------------------------------------------------- */
:root{
  --bg:#291C19; --surface:#33241F; --surface-2:#3B2A24;
  --line:rgba(250,247,245,.14); --line-strong:rgba(250,247,245,.28);
  --scrim:rgba(41,28,25,.72);
  --rose:#C97C79; --rose-light:#E4A49D; --rose-pale:#F0CFC9;
  --chip-bg:rgba(219,146,138,.22);
  --cream:#FAF7F5; --muted:#A99E99; --muted-dim:#7C716C;
  --font-serif:'Playfair Display','Cormorant Garamond',Georgia,serif;
  --font-sans:'Inter','Poppins',-apple-system,'Segoe UI',Roboto,sans-serif;
  --gutter:36px; --r-card:16px; --r-input:14px; --r-btn:10px; --r-pill:999px;
}

/* ---------- 2. RESET + FRAME -------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#171010; font-family:var(--font-sans);
     display:flex; justify-content:center; padding:40px 0;
     -webkit-font-smoothing:antialiased;}
/* .screen = the artboard, 1:1 with the mock. Not responsive by design. */
.screen{width:853px; min-height:1844px; background:var(--bg); color:var(--cream);
        position:relative; overflow:hidden; display:flex; flex-direction:column;}
img{display:block; max-width:100%}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
a{color:inherit; text-decoration:none}
ul,ol{margin:0; padding:0; list-style:none}

/* placeholder styling for not-yet-supplied images — DELETE when images land */
img{background:var(--surface-2); border:1px dashed var(--line);
    font-family:var(--font-sans); font-size:11px; color:var(--muted-dim);
    text-align:center; overflow:hidden}
/* the real logo lockup ships as a PNG asset — opt it out of the
   dashed placeholder treatment above */
.logo{display:block; border:0; background:none}

/* ---------- 3. TYPE SCALE ------------------------------------------------ */
.t-display{font-family:var(--font-serif); font-size:52px; line-height:1.02; font-weight:400; margin:0}
.t-h1     {font-family:var(--font-serif); font-size:64px; line-height:1.05; font-weight:400; margin:0}
.t-title  {font-family:var(--font-serif); font-size:40px; line-height:1.15; font-weight:400; margin:0}
.t-section{font-family:var(--font-serif); font-size:34px; line-height:1.2;  font-weight:400; margin:0}
.t-h3     {font-family:var(--font-serif); font-size:24px; line-height:1.25; font-weight:400; margin:0}
.t-card   {font-family:var(--font-serif); font-size:18px; line-height:1.3;  font-weight:400; margin:0}
.t-body-lg{font-size:22px; line-height:1.45; font-weight:300; margin:0}
.t-body   {font-size:16px; line-height:1.55; font-weight:300; margin:0}
.t-row    {font-size:26px; line-height:1.3; font-weight:300; margin:0}
.t-meta   {font-size:14px; line-height:1.4; color:var(--muted); margin:0}
.t-eyebrow{font-size:13px; line-height:1; letter-spacing:.16em; text-transform:uppercase; font-weight:500}
.t-price  {font-family:var(--font-serif); font-size:22px; line-height:1.2; color:var(--rose-light)}
.t-voice  {font-family:var(--font-serif); font-style:italic; font-size:19px; line-height:1.4}
.t-tab    {font-size:15px; line-height:1; letter-spacing:.12em; text-transform:uppercase}

/* ---------- 4. STATUS BAR (iOS chrome, not app UI) ---------------------- */
.statusbar{height:70px; flex:0 0 70px; display:flex; align-items:center;
           justify-content:space-between; padding:0 var(--gutter);
           font-size:26px; font-weight:600; letter-spacing:.01em}
.statusbar__icons{display:flex; align-items:center; gap:9px}

/* ---------- 5. APP BAR --------------------------------------------------- */
.appbar{flex:0 0 103px; min-height:0; display:flex; align-items:center; justify-content:space-between;
        padding:0 var(--gutter) 14px}
/* min-height:0 keeps the bar at its measured 103px: the logo lockup is 94px
   tall and overhangs the 89px content box slightly, exactly as in the mock */
.appbar__logo{display:block; line-height:1}
.appbar__actions{display:flex; align-items:center; gap:34px}
.appbar__action{position:relative; display:block; color:var(--cream)}
.appbar__badge{position:absolute; top:-10px; right:-14px; min-width:30px; height:30px;
               padding:0 8px; border-radius:var(--r-pill); background:var(--rose);
               color:var(--cream); font-size:16px; font-weight:600; display:grid; place-items:center}

/* ---------- 6. SECTION HEADER ------------------------------------------- */
.section{padding:38px 0 0}
.section__head{display:flex; align-items:baseline; justify-content:space-between;
               padding:0 var(--gutter); margin-bottom:22px}
.section__link{display:inline-flex; align-items:center; gap:10px; font-size:19px; color:var(--rose-light)}

/* ---------- 7. BUTTONS + CHIPS ------------------------------------------ */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:16px;
     border-radius:var(--r-btn); padding:0 34px; height:64px}
.btn--primary{background:var(--rose); color:#fff}
.btn--outline{border:1px solid var(--line-strong); color:var(--cream)}
.btn--text{padding:0; height:auto; color:var(--rose-light)}
.btn--block{display:flex; width:100%}
.chip{display:inline-flex; align-items:center; height:42px; padding:0 20px;
      border-radius:var(--r-pill); font-size:16px}
.chip--member{background:var(--chip-bg); color:var(--rose-pale)}

/* ---------- 8. TAB BAR + HOME INDICATOR --------------------------------- */
.tabbar{flex:0 0 88px; margin-top:auto; display:flex; align-items:center;
        border-top:1px solid var(--line); background:var(--bg)}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:9px; color:var(--cream)}
.tab--active{color:var(--rose-light)}
.home-indicator{flex:0 0 44px; display:grid; place-items:center; background:var(--bg)}
.home-indicator::after{content:""; width:286px; height:10px; border-radius:5px; background:var(--cream)}

/* ==========================================================================
   SCREEN: ADD ADDRESS
   Page padding on this screen measures 44px left / 41px right (the shared
   --gutter is 36px). Using the measured 44px; see ASSUMPTION in the markup.
   ========================================================================== */
.page{--pad:44px; display:flex; flex-direction:column}

/* --- NAV BAR: back arrow only, no title. 105px tall, arrow 38x32 ---------- */
.navbar{flex:0 0 105px; display:flex; align-items:center; padding:0 var(--pad)}
.navbar__back{display:block; color:var(--rose-light)}

/* --- PAGE HEAD: 64px serif title + 2-line 22px subtitle ------------------ */
.page-head{padding:16px var(--pad) 0}
.page-head__sub{margin-top:5px; color:var(--cream)}

/* --- FORM: stack of .field rows, 10px apart ------------------------------ */
.form{display:flex; flex-direction:column; gap:10px; padding:0 var(--pad); margin-top:44px}

/* --------------------------------------------------------------------------
   .field — THE SHARED FORM ROW. Leading rose icon (36px) + label above value.
   Filled surface, hairline border, 14px radius. Row is 104px tall; 143px when
   it carries a .field__hint line. This exact component is reused on
   C11 CheckoutDetails, C12 CheckoutPayments, C20 LoginSignup and here.
   Measured: field box left 44 -> icon left 78 (34px inset), icon 36px wide,
   42px gap, label baseline 409, value baseline ~447 in row 1 (371..475).
   -------------------------------------------------------------------------- */
.field{display:flex; align-items:center; gap:42px;
       min-height:104px; padding:22px 28px 22px 34px;
       background:var(--surface); border:1px solid var(--line);
       border-radius:var(--r-input)}
.field__icon{flex:0 0 36px; height:38px; color:var(--rose-light)}
.field__body{flex:1 1 auto; min-width:0}
.field__label{display:block; font-size:19px; line-height:1.1; color:var(--muted); font-weight:300}
.field__input{display:block; width:100%; margin-top:11px; padding:0; border:0; background:none;
              color:var(--cream); font-family:var(--font-sans); font-size:24px;
              line-height:1.2; font-weight:300; -webkit-appearance:none; appearance:none;
              border-radius:0}
.field__input:focus{outline:none}
.field__input::placeholder{color:var(--muted-dim)}
.field__hint{display:block; margin:18px 0 0; font-size:19px; line-height:1.2;
              color:var(--muted); font-weight:300}
.field__chevron{flex:0 0 auto; color:var(--rose-pale)}
/* .field--select = the row ends in a chevron-down and the control is a <select> */
.field--select .field__input{cursor:pointer}
/* .field--link = the row ends in a chevron-right and pushes to another screen */
.field--link{cursor:pointer; text-align:left; width:100%; font:inherit; color:inherit}

/* --- TOGGLE ROW: same .field shell, switch instead of an input ----------- */
.field--toggle{margin-top:4px}
.field__title{display:block; font-size:26px; line-height:1.2; font-weight:300; color:var(--cream)}
.field__desc{display:block; margin:11px 0 0; font-size:19px; line-height:1.2;
             color:var(--muted); font-weight:300}

/* Real <input type="checkbox">, styled as an iOS switch. 76 x 44, knob 36. */
.switch{position:relative; flex:0 0 76px; width:76px; height:44px; display:block}
.switch__input{position:absolute; inset:0; width:100%; height:100%; margin:0;
               opacity:0; cursor:pointer; z-index:2}
.switch__track{position:absolute; inset:0; border-radius:var(--r-pill);
               background:var(--surface-2); border:1px solid var(--line); transition:none}
.switch__track::after{content:""; position:absolute; top:3px; left:3px;
                      width:36px; height:36px; border-radius:var(--r-pill); background:var(--muted)}
.switch__input:checked + .switch__track{background:var(--rose); border-color:transparent}
.switch__input:checked + .switch__track::after{left:auto; right:3px; background:#FFFFFF}

/* --- PRIMARY ACTION: full-width rose button, 88px tall ------------------- */
.form-action{padding:0 var(--pad); margin-top:28px}
.btn--save{height:88px; letter-spacing:.22em; font-size:22px; font-weight:400;
           text-transform:uppercase; border-radius:12px}
</style>
</head>
<body>

<div class="screen">

  <!-- ==================================================================
       STATUS BAR — iOS chrome drawn into the mock. Not app UI; delete this
       block when building the real screen.
       ================================================================== -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="statusbar__icons">
      <svg width="32" height="21" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="30" height="21" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.5 5.9 8.3a3 3 0 0 1 4.2 0L8 10.5Zm0-4.6a5.4 5.4 0 0 0-3.8 1.6L2.8 6.1a7.4 7.4 0 0 1 10.4 0l-1.4 1.4A5.4 5.4 0 0 0 8 5.9Zm0-3.8a9.2 9.2 0 0 0-6.5 2.7L.1 3.4a11.2 11.2 0 0 1 15.8 0l-1.4 1.4A9.2 9.2 0 0 0 8 2.1Z"/></svg>
      <svg width="46" height="22" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".5"/></svg>
    </span>
  </div>

  <!-- ICON: approximated, swap for production icon set -->

  <div class="page">

    <!-- ==================================================================
         NAV BAR — back arrow only (rose), no title text. Arrow measured
         38 x 32 at x=45, vertical centre y=125.
         ================================================================== -->
    <nav class="navbar">
      <button class="navbar__back" aria-label="Back">
        <svg width="38" height="32" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 10H1M9 2 1 10l8 8"/></svg>
      </button>
    </nav>

    <!-- ==================================================================
         PAGE HEAD — screen title + 2-line supporting line.
         ASSUMPTION: title is set with the shared .t-h1 token (64px). The cap
         height measured in this mock (51px) implies roughly a 73-76px face —
         kept on the token for cross-screen consistency; confirm with design.
         ================================================================== -->
    <header class="page-head">
      <h1 class="t-h1">Add Address</h1>
      <p class="t-body-lg page-head__sub">Add a new delivery address to receive your<br>orders seamlessly.</p>
    </header>

    <!-- ==================================================================
         FORM — 9 rows, 10px apart, all built from the shared .field
         component. Rows 1,2,5,6,7,8 are 104px tall; rows 3 and 4 carry a
         hint line and are 143px tall.
         Field row y positions in the mock:
           Full Name          371-475
           Phone Number       485-589
           Address Line 1     600-743   (+ hint)
           Address Line 2     753-896   (+ hint)
           City               906-1010  (select, chevron-down)
           State / Province   1019-1123 (chevron-RIGHT — see DEVIATION-RISK)
           Postal Code        1132-1236
           Country            1245-1349 (select, chevron-down)
           Set as default     1363-1467 (toggle, ON)
         ================================================================== -->
    <form class="form" action="#" method="post">

      <!-- SECTION: Full Name — filled text input -->
      <label class="field">
        <span class="field__icon">
          <svg width="36" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
        </span>
        <span class="field__body">
          <span class="field__label">Full Name</span>
          <input class="field__input" type="text" name="fullName" value="Aanya Sharma" placeholder="Full Name">
        </span>
      </label>

      <!-- SECTION: Phone Number -->
      <label class="field">
        <span class="field__icon">
          <svg width="36" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h3l2 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 2v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4 5.2 2 2 0 0 1 6 3Z"/></svg>
        </span>
        <span class="field__body">
          <span class="field__label">Phone Number</span>
          <input class="field__input" type="tel" name="phone" value="+977 98123 45678" placeholder="Phone Number">
        </span>
      </label>

      <!-- SECTION: Address Line 1 — value + grey hint line beneath.
           The hint string doubles as the empty-state placeholder. -->
      <label class="field">
        <span class="field__icon">
          <svg width="36" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12Z"/><circle cx="12" cy="10" r="2.6"/></svg>
        </span>
        <span class="field__body">
          <span class="field__label">Address Line 1</span>
          <input class="field__input" type="text" name="address1" value="B-102, Maple Residency" placeholder="House no., Building, Street, Area">
          <span class="field__hint">House no., Building, Street, Area</span>
        </span>
      </label>

      <!-- SECTION: Address Line 2 (Optional) — value + grey hint line -->
      <label class="field">
        <span class="field__icon">
          <svg width="36" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 21V6l7-3v18M11 21V9l9 3v9"/><path d="M6.5 9h2M6.5 13h2M6.5 17h2M14 14h3M14 18h3"/></svg>
        </span>
        <span class="field__body">
          <span class="field__label">Address Line 2 (Optional)</span>
          <input class="field__input" type="text" name="address2" value="Panipokhari" placeholder="Landmark, Apartment, Suite, etc.">
          <span class="field__hint">Landmark, Apartment, Suite, etc.</span>
        </span>
      </label>

      <!-- SECTION: City — select variant of .field, chevron-down at the right -->
      <label class="field field--select">
        <span class="field__icon">
          <svg width="36" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 21V8l6-4v17M10 21V11l10 3v7"/><path d="M6.2 10h1.8M6.2 14h1.8M6.2 18h1.8M13 15h2M13 18h2M17 15h1.6M17 18h1.6"/></svg>
        </span>
        <span class="field__body">
          <span class="field__label">City</span>
          <select class="field__input" name="city">
            <option selected>Kathmandu</option>
          </select>
        </span>
        <span class="field__chevron">
          <svg width="26" height="14" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l11 10L24 2"/></svg>
        </span>
      </label>

      <!-- SECTION: State / Province.
           DEVIATION-RISK: this row is visually a sibling of City and Country
           but ends in a chevron-RIGHT, not a chevron-down — i.e. it reads as a
           push-to-new-screen picker while its two siblings read as inline
           selects. Same data shape, two different affordances. Marked up here
           as a <button> to match what is drawn; confirm the intended pattern. -->
      <button type="button" class="field field--link">
        <span class="field__icon">
          <svg width="36" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 6.5 9 4l6 2.5L22 4v13.5L15 20l-6-2.5L2 20Z"/><path d="M9 4v13.5M15 6.5V20"/></svg>
        </span>
        <span class="field__body">
          <span class="field__label">State / Province</span>
          <span class="field__input">Bagmati</span>
        </span>
        <span class="field__chevron">
          <svg width="14" height="26" viewBox="0 0 14 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l10 11L2 24"/></svg>
        </span>
      </button>

      <!-- SECTION: Postal Code -->
      <label class="field">
        <span class="field__icon">
          <svg width="36" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3 7 9 6.5L21 7"/></svg>
        </span>
        <span class="field__body">
          <span class="field__label">Postal Code</span>
          <input class="field__input" type="text" inputmode="numeric" name="postal" value="44600" placeholder="Postal Code">
        </span>
      </label>

      <!-- SECTION: Country — select variant, chevron-down -->
      <label class="field field--select">
        <span class="field__icon">
          <svg width="36" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/></svg>
        </span>
        <span class="field__body">
          <span class="field__label">Country</span>
          <select class="field__input" name="country">
            <option selected>Nepal</option>
          </select>
        </span>
        <span class="field__chevron">
          <svg width="26" height="14" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l11 10L24 2"/></svg>
        </span>
      </label>

      <!-- SECTION: "Set as default address" — same .field shell, real
           <input type="checkbox"> styled as a 76x44 switch. Drawn ON in the
           mock (rose track, knob to the right). -->
      <label class="field field--toggle">
        <span class="field__icon">
          <svg width="36" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5.5 9.5V21h13V9.5"/><path d="M10 21v-5.5h4V21"/></svg>
        </span>
        <span class="field__body">
          <span class="field__title">Set as default address</span>
          <span class="field__desc">Use this address for all future orders</span>
        </span>
        <span class="switch">
          <input class="switch__input" type="checkbox" name="setDefault" checked>
          <span class="switch__track"></span>
        </span>
      </label>
    </form>

    <!-- ==================================================================
         PRIMARY ACTION — full-width rose button, 88px tall, letterspaced
         uppercase label. Measured x 45..810, y 1495..1582.
         ================================================================== -->
    <div class="form-action">
      <button class="btn btn--primary btn--block btn--save" type="submit">Save Address</button>
    </div>
  </div>

  <!-- ==================================================================
       TAB BAR — ME active. Identical block on C03, C04, C09, C17.
       ================================================================== -->
  <nav class="tabbar">
    <a class="tab" href="C03-Home.html">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3 3 10v11h6v-6h6v6h6V10l-9-7Z"/></svg>
      <span class="t-tab">Home</span>
    </a>
    <a class="tab" href="C04-Shop.html">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="t-tab">Shop</span>
    </a>
    <a class="tab" href="C09-Wishlist.html">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 20.5S3 14.8 3 9.2A5 5 0 0 1 12 6.5 5 5 0 0 1 21 9.2c0 5.6-9 11.3-9 11.3Z"/></svg>
      <span class="t-tab">Wishlist</span>
    </a>
    <a class="tab tab--active" href="C17-Me.html" aria-current="page">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0Z"/></svg>
      <span class="t-tab">Me</span>
    </a>
  </nav>

  <div class="home-indicator"></div>

</div>
</body>
</html>
