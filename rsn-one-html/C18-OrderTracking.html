<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSN ONE — C18 OrderTracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   RSN ONE — C18 OrderTracking
   Source mock: rsn-one-design/C18-OrderTracking.png  (853 x 1844, 1x)
   Authored 1:1 with the mock. Every value here is the pixel value measured
   in the PNG — no scaling. To preview at phone size: .screen{zoom:.5}
   Tokens + base components (sections 1-8) are IDENTICAL in every CXX file and
   are copied verbatim from C03-Home.html; see RSN-HANDOFF-SPEC.md.
   Screen-specific CSS starts at "SCREEN: ORDERTRACKING".
   ========================================================================== */

/* ---------- 1. TOKENS ---------------------------------------------------- */
:root{
  --bg:#291C19; --surface:#33241F; --surface-2:#3B2A24;
  --line:rgba(250,247,245,.14); --line-strong:rgba(250,247,245,.28);
  --scrim:rgba(41,28,25,.72);
  --rose:#C97C79; --rose-light:#E4A49D; --rose-pale:#F0CFC9;
  --chip-bg:rgba(219,146,138,.22);
  --cream:#FAF7F5; --muted:#A99E99; --muted-dim:#7C716C;
  --font-serif:'Playfair Display','Cormorant Garamond',Georgia,serif;
  --font-sans:'Inter','Poppins',-apple-system,'Segoe UI',Roboto,sans-serif;
  --gutter:36px; --r-card:16px; --r-input:14px; --r-btn:10px; --r-pill:999px;
}

/* ---------- 2. RESET + FRAME -------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#171010; font-family:var(--font-sans);
     display:flex; justify-content:center; padding:40px 0;
     -webkit-font-smoothing:antialiased;}
/* .screen = the artboard, 1:1 with the mock. Not responsive by design. */
.screen{width:853px; min-height:1844px; background:var(--bg); color:var(--cream);
        position:relative; overflow:hidden; display:flex; flex-direction:column;}
img{display:block; max-width:100%}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
a{color:inherit; text-decoration:none}
ul,ol{margin:0; padding:0; list-style:none}

/* placeholder styling for not-yet-supplied images — DELETE when images land */
img{background:var(--surface-2); border:1px dashed var(--line);
    font-family:var(--font-sans); font-size:11px; color:var(--muted-dim);
    text-align:center; overflow:hidden}
/* the real logo lockup ships as a PNG asset — opt it out of the
   dashed placeholder treatment above */
.logo{display:block; border:0; background:none}

/* ---------- 3. TYPE SCALE ------------------------------------------------ */
.t-display{font-family:var(--font-serif); font-size:52px; line-height:1.02; font-weight:400; margin:0}
.t-h1     {font-family:var(--font-serif); font-size:64px; line-height:1.05; font-weight:400; margin:0}
.t-title  {font-family:var(--font-serif); font-size:40px; line-height:1.15; font-weight:400; margin:0}
.t-section{font-family:var(--font-serif); font-size:34px; line-height:1.2;  font-weight:400; margin:0}
.t-h3     {font-family:var(--font-serif); font-size:24px; line-height:1.25; font-weight:400; margin:0}
.t-card   {font-family:var(--font-serif); font-size:18px; line-height:1.3;  font-weight:400; margin:0}
.t-body-lg{font-size:22px; line-height:1.45; font-weight:300; margin:0}
.t-body   {font-size:16px; line-height:1.55; font-weight:300; margin:0}
.t-row    {font-size:26px; line-height:1.3; font-weight:300; margin:0}
.t-meta   {font-size:14px; line-height:1.4; color:var(--muted); margin:0}
.t-eyebrow{font-size:13px; line-height:1; letter-spacing:.16em; text-transform:uppercase; font-weight:500}
.t-price  {font-family:var(--font-serif); font-size:22px; line-height:1.2; color:var(--rose-light)}
.t-voice  {font-family:var(--font-serif); font-style:italic; font-size:19px; line-height:1.4}
.t-tab    {font-size:15px; line-height:1; letter-spacing:.12em; text-transform:uppercase}

/* ---------- 4. STATUS BAR (iOS chrome, not app UI) ---------------------- */
.statusbar{height:70px; flex:0 0 70px; display:flex; align-items:center;
           justify-content:space-between; padding:0 var(--gutter);
           font-size:26px; font-weight:600; letter-spacing:.01em}
.statusbar__icons{display:flex; align-items:center; gap:9px}

/* ---------- 5. APP BAR --------------------------------------------------- */
.appbar{flex:0 0 103px; min-height:0; display:flex; align-items:center; justify-content:space-between;
        padding:0 var(--gutter) 14px}
/* min-height:0 keeps the bar at its measured 103px: the logo lockup is 94px
   tall and overhangs the 89px content box slightly, exactly as in the mock */
.appbar__logo{display:block; line-height:1}
.appbar__actions{display:flex; align-items:center; gap:34px}
.appbar__action{position:relative; display:block; color:var(--cream)}
.appbar__badge{position:absolute; top:-10px; right:-14px; min-width:30px; height:30px;
               padding:0 8px; border-radius:var(--r-pill); background:var(--rose);
               color:var(--cream); font-size:16px; font-weight:600; display:grid; place-items:center}

/* ---------- 6. SECTION HEADER ------------------------------------------- */
.section{padding:38px 0 0}
.section__head{display:flex; align-items:baseline; justify-content:space-between;
               padding:0 var(--gutter); margin-bottom:22px}
.section__link{display:inline-flex; align-items:center; gap:10px; font-size:19px; color:var(--rose-light)}

/* ---------- 7. BUTTONS + CHIPS ------------------------------------------ */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:16px;
     border-radius:var(--r-btn); padding:0 34px; height:64px}
.btn--primary{background:var(--rose); color:#fff}
.btn--outline{border:1px solid var(--line-strong); color:var(--cream)}
.btn--text{padding:0; height:auto; color:var(--rose-light)}
.btn--block{display:flex; width:100%}
.chip{display:inline-flex; align-items:center; height:42px; padding:0 20px;
      border-radius:var(--r-pill); font-size:16px}
.chip--member{background:var(--chip-bg); color:var(--rose-pale)}

/* ---------- 8. TAB BAR + HOME INDICATOR --------------------------------- */
.tabbar{flex:0 0 88px; margin-top:auto; display:flex; align-items:center;
        border-top:1px solid var(--line); background:var(--bg)}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:9px; color:var(--cream)}
.tab--active{color:var(--rose-light)}
.home-indicator{flex:0 0 44px; display:grid; place-items:center; background:var(--bg)}
.home-indicator::after{content:""; width:286px; height:10px; border-radius:5px; background:var(--cream)}

/* ==========================================================================
   SCREEN: ORDERTRACKING
   Back bar (arrow only, no title) → order title → single product line →
   vertical 8-step status timeline. NO tab bar on this screen: the timeline
   runs to y=1685 and the home indicator follows directly.
   ========================================================================== */

/* --- BACK BAR: arrow only, no title ------------------------------------- */
.navbar{flex:0 0 103px; display:flex; align-items:center; padding:0 36px 0 48px}
.navbar__back{display:block; color:var(--rose-pale)}

/* --- ORDER TITLE: two lines at two different sizes ----------------------
   Measured: "Order" cap 51px (≈72px type), "RSN-10482" cap 68px (≈96px).
   ------------------------------------------------------------------------ */
.order-title{padding:19px 36px 0 56px}
.order-title__label{font-family:var(--font-serif); font-size:72px; line-height:1;
                    font-weight:400; margin:0}
.order-title__id{font-family:var(--font-serif); font-size:96px; line-height:1;
                 font-weight:400; margin:0; display:block}

/* --- ORDERED PRODUCT: one line, 321x297 image + name / house / price ----- */
.order-product{display:flex; gap:44px; align-items:flex-start; padding:50px 36px 0 56px}
.order-product__media{width:321px; height:297px; object-fit:cover;
                      border-radius:24px; flex:0 0 321px}
.order-product__body{padding-top:46px}
.order-product__title{font-family:var(--font-serif); font-size:50px; line-height:1;
                      font-weight:400; margin:0}
.order-product__house{margin:24px 0 0; font-size:38px; line-height:1;
                      font-weight:300; color:var(--muted)}
.order-product__price{margin:34px 0 0; font-size:48px; line-height:1;
                      font-weight:500; color:var(--rose-light)}

/* --- TIMELINE (SHARED, VERTICAL) ---------------------------------------
   Reusable order-status block. Also used — laid out horizontally — inside
   the tracker card on C26 Order Detail (see .timeline--horizontal there).
   States: .timeline__step--done | --current | (no modifier) = pending.
   Measured: marker column centred on x=116, connector 5px wide, step pitch
   118px, the one step that carries a timestamp is 145px tall.
   ------------------------------------------------------------------------ */
.timeline{margin:66px 0 0; padding:0 36px 0 92px}
.timeline__step{position:relative; display:flex; gap:70px; padding-bottom:70px}
.timeline__step--timed{padding-bottom:48px}
.timeline__step::before{content:""; position:absolute; left:22px; top:24px;
                        bottom:0; width:5px; background:var(--line-strong)}
.timeline__step--done::before,
.timeline__step--current::before{background:var(--rose-light)}
.timeline__step:last-child::before{display:none}
.timeline__marker{position:relative; z-index:1; flex:0 0 48px; height:48px;
                  display:grid; place-items:center}
.timeline__dot{width:48px; height:48px; border-radius:var(--r-pill);
               border:3px solid var(--line-strong); background:var(--bg)}
.timeline__step--done  .timeline__dot,
.timeline__step--current .timeline__dot{border-color:transparent; background:var(--rose-light)}
/* two of the completed markers are drawn 36px instead of 48px — see note */
.timeline__dot--sm{width:36px; height:36px}
.timeline__label{margin:0; font-size:40px; line-height:48px; font-weight:300; color:var(--muted)}
.timeline__step--done .timeline__label{color:var(--cream)}
.timeline__step--current .timeline__label{color:var(--rose-light)}
.timeline__time{margin:17px 0 0; font-size:32px; line-height:1; font-weight:300;
                color:var(--muted)}
</style>
</head>
<body>

<div class="screen">

  <!-- ICON: approximated, swap for production icon set -->

  <!-- ==================================================================
       STATUS BAR — iOS chrome drawn into the mock. Not app UI; delete this
       block when building the real screen.
       ================================================================== -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="statusbar__icons">
      <svg width="32" height="21" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="30" height="21" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.5 5.9 8.3a3 3 0 0 1 4.2 0L8 10.5Zm0-4.6a5.4 5.4 0 0 0-3.8 1.6L2.8 6.1a7.4 7.4 0 0 1 10.4 0l-1.4 1.4A5.4 5.4 0 0 0 8 5.9Zm0-3.8a9.2 9.2 0 0 0-6.5 2.7L.1 3.4a11.2 11.2 0 0 1 15.8 0l-1.4 1.4A9.2 9.2 0 0 0 8 2.1Z"/></svg>
      <svg width="46" height="22" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".5"/></svg>
    </span>
  </div>

  <!-- ==================================================================
       BACK BAR — rose back arrow at x=49, y=114. No title, no actions.
       ================================================================== -->
  <header class="navbar">
    <button class="navbar__back" aria-label="Back">
      <svg width="47" height="42" viewBox="0 0 24 21" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M23 10.5H1"/><path d="M9.5 1 1 10.5 9.5 20"/></svg>
    </button>
  </header>

  <!-- ==================================================================
       ORDER TITLE — two lines, two sizes: "Order" ≈72px, the order number
       ≈96px. Both serif, cream.
       ================================================================== -->
  <div class="order-title">
    <h1 class="order-title__label">Order</h1>
    <span class="order-title__id">RSN-10482</span>
  </div>

  <!-- ==================================================================
       ORDERED PRODUCT — single line item. Image 321x297, radius 24, at
       x=56 / y=410. Copy block starts at x=420.
       DEVIATION-RISK: the house is spelled "House of Lazaripat" here, but
       "House of Lazimpat" on C03 Home and C26 Order Detail for the same
       Copper Vessel. One of the two is a typo.
       ASSUMPTION: this is the only screen that shows a PLAIN HAMMERED
       vessel — C03, C24, C25 and C26 all show the engraved one
       (prod-copper-vessel-01 and its -02/-03/-04 angles). Registered here
       as a new angle, prod-copper-vessel-05. If it is meant to be the same
       photo as everywhere else, swap it back to prod-copper-vessel-01.
       ================================================================== -->
  <section class="order-product">
    <img class="order-product__media" src="rsn-one-images/prod-copper-vessel-05.jpg"
         alt="prod-copper-vessel-05" width="321" height="297">
    <div class="order-product__body">
      <h2 class="order-product__title">Copper Vessel</h2>
      <p class="order-product__house">House of Lazaripat</p>
      <p class="order-product__price">₹25,199</p>
    </div>
  </section>

  <!-- ==================================================================
       STATUS TIMELINE — 8 steps, vertical. Confirmed / Processing /
       At House are complete, Verified is the current step (rose label),
       Sealed / In Transit / Out for Delivery / Delivered are pending
       (hollow markers, grey connector). Only the first step carries a
       timestamp.
       DEVIATION-RISK: the "Processing" and "At House" markers are drawn
       36px while every other marker is 48px — reproduced here, but it
       reads as a drawing slip rather than a state.
       DEVIATION-RISK: a small stray bracket shape hangs below the final
       "Delivered" marker in the mock (y≈1670-1690), where the connector
       should simply stop. Not reproduced — treat as an artwork artifact.
       ASSUMPTION: no dates are shown for steps 2-8; the mock leaves them
       blank rather than showing them empty.
       ================================================================== -->
  <ol class="timeline">
      <li class="timeline__step timeline__step--done timeline__step--timed">
        <span class="timeline__marker"><span class="timeline__dot"></span></span>
        <div class="timeline__body">
          <p class="timeline__label">Confirmed</p>
        <p class="timeline__time">12 Sep, 10:30 AM</p>
        </div>
      </li>
      <li class="timeline__step timeline__step--done">
        <span class="timeline__marker"><span class="timeline__dot timeline__dot--sm"></span></span>
        <div class="timeline__body">
          <p class="timeline__label">Processing</p>
        </div>
      </li>
      <li class="timeline__step timeline__step--done">
        <span class="timeline__marker"><span class="timeline__dot timeline__dot--sm"></span></span>
        <div class="timeline__body">
          <p class="timeline__label">At House</p>
        </div>
      </li>
      <li class="timeline__step timeline__step--current">
        <span class="timeline__marker"><span class="timeline__dot"></span></span>
        <div class="timeline__body">
          <p class="timeline__label">Verified</p>
        </div>
      </li>
      <li class="timeline__step">
        <span class="timeline__marker"><span class="timeline__dot"></span></span>
        <div class="timeline__body">
          <p class="timeline__label">Sealed</p>
        </div>
      </li>
      <li class="timeline__step">
        <span class="timeline__marker"><span class="timeline__dot"></span></span>
        <div class="timeline__body">
          <p class="timeline__label">In Transit</p>
        </div>
      </li>
      <li class="timeline__step">
        <span class="timeline__marker"><span class="timeline__dot"></span></span>
        <div class="timeline__body">
          <p class="timeline__label">Out for Delivery</p>
        </div>
      </li>
      <li class="timeline__step">
        <span class="timeline__marker"><span class="timeline__dot"></span></span>
        <div class="timeline__body">
          <p class="timeline__label">Delivered</p>
        </div>
      </li>
  </ol>

  <!-- No tab bar on this screen — the mock ends with the home indicator. -->
  <div class="home-indicator" style="margin-top:auto"></div>

</div>

</body>
</html>
