<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSN ONE — C07 Product Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   RSN ONE — C07 Product Detail (PDP)
   Source mock: rsn-one-design/C07-ProductDetail.png  (853 x 1844, 1x)
   Authored 1:1 with the mock. Every value here is the pixel value measured
   in the PNG — no scaling. To preview at phone size: .screen{zoom:.5}
   Tokens + base components are IDENTICAL in every CXX file; see
   RSN-HANDOFF-SPEC.md. Screen-specific CSS starts at "SCREEN: PRODUCT DETAIL".
   ========================================================================== */

/* ---------- 1. TOKENS ---------------------------------------------------- */
:root{
  --bg:#291C19; --surface:#33241F; --surface-2:#3B2A24;
  --line:rgba(250,247,245,.14); --line-strong:rgba(250,247,245,.28);
  --scrim:rgba(41,28,25,.72);
  --rose:#C97C79; --rose-light:#E4A49D; --rose-pale:#F0CFC9;
  --chip-bg:rgba(219,146,138,.22);
  --cream:#FAF7F5; --muted:#A99E99; --muted-dim:#7C716C;
  --font-serif:'Playfair Display','Cormorant Garamond',Georgia,serif;
  --font-sans:'Inter','Poppins',-apple-system,'Segoe UI',Roboto,sans-serif;
  --gutter:36px; --r-card:16px; --r-input:14px; --r-btn:10px; --r-pill:999px;
}

/* ---------- 2. RESET + FRAME -------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#171010; font-family:var(--font-sans);
     display:flex; justify-content:center; padding:40px 0;
     -webkit-font-smoothing:antialiased;}
/* .screen = the artboard, 1:1 with the mock. Not responsive by design. */
.screen{width:853px; min-height:1844px; background:var(--bg); color:var(--cream);
        position:relative; overflow:hidden; display:flex; flex-direction:column;}
img{display:block; max-width:100%}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
a{color:inherit; text-decoration:none}
ul,ol{margin:0; padding:0; list-style:none}

/* placeholder styling for not-yet-supplied images — DELETE when images land */
img{background:var(--surface-2); border:1px dashed var(--line);
    font-family:var(--font-sans); font-size:11px; color:var(--muted-dim);
    text-align:center; overflow:hidden}
/* the real logo lockup ships as a PNG asset — opt it out of the
   dashed placeholder treatment above */
.logo{display:block; border:0; background:none}

/* ---------- 3. TYPE SCALE ------------------------------------------------ */
.t-display{font-family:var(--font-serif); font-size:52px; line-height:1.02; font-weight:400; margin:0}
.t-h1     {font-family:var(--font-serif); font-size:64px; line-height:1.05; font-weight:400; margin:0}
.t-title  {font-family:var(--font-serif); font-size:40px; line-height:1.15; font-weight:400; margin:0}
.t-section{font-family:var(--font-serif); font-size:34px; line-height:1.2;  font-weight:400; margin:0}
.t-h3     {font-family:var(--font-serif); font-size:24px; line-height:1.25; font-weight:400; margin:0}
.t-card   {font-family:var(--font-serif); font-size:18px; line-height:1.3;  font-weight:400; margin:0}
.t-body-lg{font-size:22px; line-height:1.45; font-weight:300; margin:0}
.t-body   {font-size:16px; line-height:1.55; font-weight:300; margin:0}
.t-row    {font-size:26px; line-height:1.3; font-weight:300; margin:0}
.t-meta   {font-size:14px; line-height:1.4; color:var(--muted); margin:0}
.t-eyebrow{font-size:13px; line-height:1; letter-spacing:.16em; text-transform:uppercase; font-weight:500}
.t-price  {font-family:var(--font-serif); font-size:22px; line-height:1.2; color:var(--rose-light)}
.t-voice  {font-family:var(--font-serif); font-style:italic; font-size:19px; line-height:1.4}
.t-tab    {font-size:15px; line-height:1; letter-spacing:.12em; text-transform:uppercase}

/* ---------- 4. STATUS BAR (iOS chrome, not app UI) ---------------------- */
.statusbar{height:70px; flex:0 0 70px; display:flex; align-items:center;
           justify-content:space-between; padding:0 var(--gutter);
           font-size:26px; font-weight:600; letter-spacing:.01em}
.statusbar__icons{display:flex; align-items:center; gap:9px}

/* ---------- 5. APP BAR --------------------------------------------------- */
.appbar{flex:0 0 103px; min-height:0; display:flex; align-items:center; justify-content:space-between;
        padding:0 var(--gutter) 14px}
/* min-height:0 keeps the bar at its measured 103px: the logo lockup is 94px
   tall and overhangs the 89px content box slightly, exactly as in the mock */
.appbar__logo{display:block; line-height:1}
.appbar__actions{display:flex; align-items:center; gap:34px}
.appbar__action{position:relative; display:block; color:var(--cream)}
.appbar__badge{position:absolute; top:-10px; right:-14px; min-width:30px; height:30px;
               padding:0 8px; border-radius:var(--r-pill); background:var(--rose);
               color:var(--cream); font-size:16px; font-weight:600; display:grid; place-items:center}

/* ---------- 6. SECTION HEADER ------------------------------------------- */
.section{padding:38px 0 0}
.section__head{display:flex; align-items:baseline; justify-content:space-between;
               padding:0 var(--gutter); margin-bottom:22px}
.section__link{display:inline-flex; align-items:center; gap:10px; font-size:19px; color:var(--rose-light)}

/* ---------- 7. BUTTONS + CHIPS ------------------------------------------ */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:16px;
     border-radius:var(--r-btn); padding:0 34px; height:64px}
.btn--primary{background:var(--rose); color:#fff}
.btn--outline{border:1px solid var(--line-strong); color:var(--cream)}
.btn--text{padding:0; height:auto; color:var(--rose-light)}
.btn--block{display:flex; width:100%}
.chip{display:inline-flex; align-items:center; height:42px; padding:0 20px;
      border-radius:var(--r-pill); font-size:16px}
.chip--member{background:var(--chip-bg); color:var(--rose-pale)}

/* ---------- 8. TAB BAR + HOME INDICATOR --------------------------------- */
.tabbar{flex:0 0 88px; margin-top:auto; display:flex; align-items:center;
        border-top:1px solid var(--line); background:var(--bg)}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:9px; color:var(--cream)}
.tab--active{color:var(--rose-light)}
.home-indicator{flex:0 0 44px; display:grid; place-items:center; background:var(--bg)}
.home-indicator::after{content:""; width:286px; height:10px; border-radius:5px; background:var(--cream)}

/* ==========================================================================
   SCREEN: PRODUCT DETAIL
   Page gutter on this screen measures 42px (content column 42 -> 811).
   ========================================================================== */
.screen{--gutter-pdp:42px}

/* --- GALLERY: full-bleed 853 x 715 photo carousel. Status bar and the
       back / logo / bag row are overlaid on the photograph. ------------- */
.pdp-gallery{position:relative; flex:0 0 715px; height:715px; overflow:hidden}
.pdp-gallery__track{display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory;
                    scrollbar-width:none}
.pdp-gallery__track::-webkit-scrollbar{display:none}
.pdp-gallery__slide{flex:0 0 853px; height:715px; scroll-snap-align:start}
/* light placeholder ground (as on C13) so the dark-ink logo stays readable
   until the photograph lands — delete with the .slot treatment */
.pdp-gallery__slide img{width:853px; height:715px; object-fit:cover; border:0;
                        background:#D9AFA0}
.pdp-gallery .statusbar{position:absolute; top:0; left:0; right:0; z-index:2; color:var(--cream)}

.pdp-topbar{position:absolute; top:88px; left:0; right:0; z-index:2;
            display:flex; align-items:flex-start; justify-content:space-between;
            padding:0 30px}
.pdp-topbar__back{color:var(--cream); display:block; margin-top:14px}
/* LOGO: dark-on-photo variant of the lockup (logo-rsnone-dark-01), 168 x 85 */
.pdp-topbar__logo{text-align:center; line-height:1; color:#33241F}
.pdp-topbar__bag{position:relative; color:var(--cream); display:block; margin-top:10px}

.pdp-wish{position:absolute; z-index:2; top:199px; right:39px;
          width:76px; height:76px; border-radius:var(--r-pill);
          background:rgba(250,247,245,.18); display:grid; place-items:center; color:var(--cream)}

.pdp-dots{position:absolute; z-index:2; left:0; right:0; bottom:40px;
          display:flex; justify-content:center; gap:23px}
.pdp-dots span{width:14px; height:14px; border-radius:var(--r-pill);
               background:rgba(250,247,245,.35)}
.pdp-dots .is-active{background:var(--cream)}

/* --- PRODUCT INFO -------------------------------------------------------- */
.pdp-info{padding:0 var(--gutter-pdp)}
.pdp-info__eyebrow{margin-top:30px; display:block; font-size:18px; line-height:1;
                   letter-spacing:.16em; text-transform:uppercase; font-weight:400;
                   color:var(--rose-light)}
.pdp-info__title{margin-top:9px}
.pdp-info__desc{margin-top:16px; font-size:24px; line-height:33px; font-weight:300}
.pdp-info__pricerow{margin-top:29px; display:flex; align-items:center; gap:32px}
.pdp-info__price{font-family:var(--font-serif); font-size:44px; line-height:1.2; color:var(--rose-light)}
.pdp-info__chip{height:47px; font-size:22px; padding:0 26px}

/* --- ACTIONS: full-width primary + outlined secondary -------------------- */
.pdp-actions{padding:0 var(--gutter-pdp); margin-top:29px}
.pdp-actions .btn{width:100%; border-radius:8px; letter-spacing:.16em;
                  text-transform:uppercase; font-size:18px; font-weight:400}
.pdp-actions .btn--primary{height:70px}
.pdp-actions .btn--wish{height:71px; margin-top:13px; border:1px solid var(--rose);
                        color:var(--rose-light); background:none}

/* --- DETAIL ACCORDION: 6 disclosure rows, 73px each, hairline between ---- */
.pdp-accordion{margin-top:27px; padding:0 var(--gutter-pdp); border-top:1px solid var(--line)}
.pdp-accordion__row{display:flex; align-items:center; justify-content:space-between;
                    width:100%; height:73px; border-bottom:1px solid var(--line);
                    text-align:left}
.pdp-accordion__row .t-section{font-size:34px}
.pdp-accordion__row svg{color:var(--cream); flex:0 0 auto}

/* --- TAB BAR: labels are Title Case on this screen, not UPPERCASE ------- */
.tabbar--roman .t-tab{text-transform:none; letter-spacing:.01em; font-size:21px; font-weight:300}
</style>
</head>
<body>

<div class="screen">

  <!-- ==================================================================
       GALLERY — full-bleed 853 x 715 product photography with a 3-dot
       carousel indicator (slide 1 active). Overlaid on it: the iOS status
       bar, a back arrow, the RSN one wordmark (dark-on-photo variant), the
       bag with a "1" badge, and a translucent circular wishlist button.
       ASSUMPTION: only slide 1 is drawn in the mock. The 3 dots say there
       are three; slides 2 and 3 are authored here as further angles of the
       same product (prod-copper-vessel-02 / -03) so the slots exist.
       ASSUMPTION: the lockup sits directly on the photo with no scrim —
       it is legible here only because this photograph is pale behind it,
       which is also why this screen takes the dark-ink logo variant.
       ================================================================== -->
  <section class="pdp-gallery">
    <div class="pdp-gallery__track">
      <div class="pdp-gallery__slide"><img src="rsn-one-images/prod-copper-vessel-01.jpg" alt="prod-copper-vessel-01" width="853" height="715"></div>
      <div class="pdp-gallery__slide"><img src="rsn-one-images/prod-copper-vessel-02.jpg" alt="prod-copper-vessel-02" width="853" height="715"></div>
      <div class="pdp-gallery__slide"><img src="rsn-one-images/prod-copper-vessel-03.jpg" alt="prod-copper-vessel-03" width="853" height="715"></div>
    </div>

    <!-- STATUS BAR — iOS chrome drawn into the mock, overlaid on the photo.
         Not app UI; delete this block when building the real screen. -->
    <div class="statusbar">
      <span>9:41</span>
      <span class="statusbar__icons">
        <!-- ICON: approximated, swap for production icon set -->
        <svg width="32" height="21" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="30" height="21" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.5 5.9 8.3a3 3 0 0 1 4.2 0L8 10.5Zm0-4.6a5.4 5.4 0 0 0-3.8 1.6L2.8 6.1a7.4 7.4 0 0 1 10.4 0l-1.4 1.4A5.4 5.4 0 0 0 8 5.9Zm0-3.8a9.2 9.2 0 0 0-6.5 2.7L.1 3.4a11.2 11.2 0 0 1 15.8 0l-1.4 1.4A9.2 9.2 0 0 0 8 2.1Z"/></svg>
        <svg width="46" height="22" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".5"/></svg>
      </span>
    </div>

    <!-- NAV BAR — back-arrow variant of the top bar, drawn over the photo -->
    <div class="pdp-topbar">
      <a class="pdp-topbar__back" href="C04-Shop.html" aria-label="Back">
        <svg width="42" height="38" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M23 11H1M9 3 1 11l8 8"/></svg>
      </a>
      <a class="pdp-topbar__logo" href="C03-Home.html" aria-label="RSN one — Global Family Club">
        <!-- LOGO: full lockup (arc + wordmark + tagline) as one asset. -->
        <img class="logo" src="rsn-one-images/logo-rsnone-dark-01.png" alt="logo-rsnone-dark-01" width="168" height="85">
      </a>
      <button class="pdp-topbar__bag" aria-label="Bag, 1 item">
        <svg width="40" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="appbar__badge">1</span>
      </button>
    </div>

    <button class="pdp-wish" aria-label="Save Copper Vessel to wishlist">
      <svg width="44" height="40" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M9 15S1 10.4 1 5.6A4.3 4.3 0 0 1 9 3.4 4.3 4.3 0 0 1 17 5.6C17 10.4 9 15 9 15Z"/></svg>
    </button>

    <div class="pdp-dots" role="tablist" aria-label="Product images">
      <span class="is-active"></span><span></span><span></span>
    </div>
  </section>

  <!-- ==================================================================
       PRODUCT INFO — house eyebrow, product name (64px serif), two-line
       description, then price (44px serif rose) beside the member-price
       chip. Content column x=42 -> 811.
       ================================================================== -->
  <section class="pdp-info">
    <a class="pdp-info__eyebrow" href="C08-HouseProfile.html">House of Lazimpat</a>
    <h1 class="t-h1 pdp-info__title">Copper Vessel</h1>
    <p class="pdp-info__desc">A timeless piece, handcrafted in Nepal using<br>traditional techniques passed down for generations.</p>
    <div class="pdp-info__pricerow">
      <span class="pdp-info__price">₹25,199</span>
      <span class="chip chip--member pdp-info__chip">Member ₹21,499</span>
    </div>
  </section>

  <!-- ==================================================================
       ACTIONS — primary "ADD TO BAG" (769 x 70, rose fill) and secondary
       "SAVE TO WISHLIST" (769 x 71, rose 1px outline + heart icon).
       DEVIATION-RISK: "Save to wishlist" duplicates the heart button
       already sitting on the gallery photo — two controls, one action, no
       shared selected state shown.
       ================================================================== -->
  <div class="pdp-actions">
    <button class="btn btn--primary">Add to bag</button>
    <button class="btn btn--wish">
      <svg width="34" height="31" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 15S1 10.4 1 5.6A4.3 4.3 0 0 1 9 3.4 4.3 4.3 0 0 1 17 5.6C17 10.4 9 15 9 15Z"/></svg>
      Save to wishlist
    </button>
  </div>

  <!-- ==================================================================
       DETAIL ACCORDION — 6 disclosure rows, 73px pitch, hairline above the
       first row and below each row, chevron-down at x=788-809.
       ASSUMPTION: every row is collapsed in the mock, so no panel content
       is shown for any of them.
       DEVIATION-RISK: the last row's hairline (y=1649) sits 8px above the
       tab bar's own hairline (y=1657) — two near-identical rules stacked.
       ================================================================== -->
  <div class="pdp-accordion">
    <button class="pdp-accordion__row" aria-expanded="false">
      <span class="t-section">The Story</span>
      <svg width="30" height="17" viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m1 1 6 6 6-6"/></svg>
    </button>
    <button class="pdp-accordion__row" aria-expanded="false">
      <span class="t-section">Materials</span>
      <svg width="30" height="17" viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m1 1 6 6 6-6"/></svg>
    </button>
    <button class="pdp-accordion__row" aria-expanded="false">
      <span class="t-section">The House</span>
      <svg width="30" height="17" viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m1 1 6 6 6-6"/></svg>
    </button>
    <button class="pdp-accordion__row" aria-expanded="false">
      <span class="t-section">Origin</span>
      <svg width="30" height="17" viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m1 1 6 6 6-6"/></svg>
    </button>
    <button class="pdp-accordion__row" aria-expanded="false">
      <span class="t-section">Verification</span>
      <svg width="30" height="17" viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m1 1 6 6 6-6"/></svg>
    </button>
    <button class="pdp-accordion__row" aria-expanded="false">
      <span class="t-section">Delivery &amp; Returns</span>
      <svg width="30" height="17" viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m1 1 6 6 6-6"/></svg>
    </button>
  </div>

  <!-- ==================================================================
       TAB BAR — SHOP active (rose, filled bag). Measured band: hairline
       y=1657, icons y=1682-1721, labels y=1738-1758.
       DEVIATION-RISK: a product detail screen is a pushed page, not a tab
       root, yet it keeps the tab bar and marks Shop active — decide whether
       the PDP is presented inside the Shop tab stack or modally.
       DEVIATION-RISK: labels are Title Case here but UPPERCASE on C03/C04;
       transcribed as drawn via .tabbar--roman.
       ================================================================== -->
  <nav class="tabbar tabbar--roman">
    <a class="tab" href="C03-Home.html">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3.5 3.5 10.5V21h17V10.5L12 3.5Z"/><path d="M10 21v-5h4v5"/></svg>
      <span class="t-tab">Home</span>
    </a>
    <a class="tab tab--active" href="C04-Shop.html" aria-current="page">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <span class="t-tab">Shop</span>
    </a>
    <a class="tab" href="C09-Wishlist.html">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 20.5S3 14.8 3 9.2A5 5 0 0 1 12 6.5 5 5 0 0 1 21 9.2c0 5.6-9 11.3-9 11.3Z"/></svg>
      <span class="t-tab">Wishlist</span>
    </a>
    <a class="tab" href="C17-Me.html">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
      <span class="t-tab">Me</span>
    </a>
  </nav>

  <div class="home-indicator"></div>

</div>
</body>
</html>
