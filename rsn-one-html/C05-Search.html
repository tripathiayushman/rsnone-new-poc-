<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSN ONE — C05 Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   RSN ONE — C05 Search (empty / pre-query state)
   Source mock: rsn-one-design/C05-Search.png  (853 x 1844, 1x)
   Authored 1:1 with the mock. Every value here is the pixel value measured
   in the PNG — no scaling. To preview at phone size: .screen{zoom:.5}
   Tokens + base components are IDENTICAL in every CXX file; see
   RSN-HANDOFF-SPEC.md. Screen-specific CSS starts at "SCREEN: SEARCH".
   ========================================================================== */

/* ---------- 1. TOKENS ---------------------------------------------------- */
:root{
  --bg:#291C19; --surface:#33241F; --surface-2:#3B2A24;
  --line:rgba(250,247,245,.14); --line-strong:rgba(250,247,245,.28);
  --scrim:rgba(41,28,25,.72);
  --rose:#C97C79; --rose-light:#E4A49D; --rose-pale:#F0CFC9;
  --chip-bg:rgba(219,146,138,.22);
  --cream:#FAF7F5; --muted:#A99E99; --muted-dim:#7C716C;
  --font-serif:'Playfair Display','Cormorant Garamond',Georgia,serif;
  --font-sans:'Inter','Poppins',-apple-system,'Segoe UI',Roboto,sans-serif;
  --gutter:36px; --r-card:16px; --r-input:14px; --r-btn:10px; --r-pill:999px;
}

/* ---------- 2. RESET + FRAME -------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#171010; font-family:var(--font-sans);
     display:flex; justify-content:center; padding:40px 0;
     -webkit-font-smoothing:antialiased;}
/* .screen = the artboard, 1:1 with the mock. Not responsive by design. */
.screen{width:853px; min-height:1844px; background:var(--bg); color:var(--cream);
        position:relative; overflow:hidden; display:flex; flex-direction:column;}
img{display:block; max-width:100%}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
a{color:inherit; text-decoration:none}
ul,ol{margin:0; padding:0; list-style:none}

/* placeholder styling for not-yet-supplied images — DELETE when images land */
img{background:var(--surface-2); border:1px dashed var(--line);
    font-family:var(--font-sans); font-size:11px; color:var(--muted-dim);
    text-align:center; overflow:hidden}
/* the real logo lockup ships as a PNG asset — opt it out of the
   dashed placeholder treatment above */
.logo{display:block; border:0; background:none}

/* ---------- 3. TYPE SCALE ------------------------------------------------ */
.t-display{font-family:var(--font-serif); font-size:52px; line-height:1.02; font-weight:400; margin:0}
.t-h1     {font-family:var(--font-serif); font-size:64px; line-height:1.05; font-weight:400; margin:0}
.t-title  {font-family:var(--font-serif); font-size:40px; line-height:1.15; font-weight:400; margin:0}
.t-section{font-family:var(--font-serif); font-size:34px; line-height:1.2;  font-weight:400; margin:0}
.t-h3     {font-family:var(--font-serif); font-size:24px; line-height:1.25; font-weight:400; margin:0}
.t-card   {font-family:var(--font-serif); font-size:18px; line-height:1.3;  font-weight:400; margin:0}
.t-body-lg{font-size:22px; line-height:1.45; font-weight:300; margin:0}
.t-body   {font-size:16px; line-height:1.55; font-weight:300; margin:0}
.t-row    {font-size:26px; line-height:1.3; font-weight:300; margin:0}
.t-meta   {font-size:14px; line-height:1.4; color:var(--muted); margin:0}
.t-eyebrow{font-size:13px; line-height:1; letter-spacing:.16em; text-transform:uppercase; font-weight:500}
.t-price  {font-family:var(--font-serif); font-size:22px; line-height:1.2; color:var(--rose-light)}
.t-voice  {font-family:var(--font-serif); font-style:italic; font-size:19px; line-height:1.4}
.t-tab    {font-size:15px; line-height:1; letter-spacing:.12em; text-transform:uppercase}

/* ---------- 4. STATUS BAR (iOS chrome, not app UI) ---------------------- */
.statusbar{height:70px; flex:0 0 70px; display:flex; align-items:center;
           justify-content:space-between; padding:0 var(--gutter);
           font-size:26px; font-weight:600; letter-spacing:.01em}
.statusbar__icons{display:flex; align-items:center; gap:9px}

/* ---------- 5. APP BAR --------------------------------------------------- */
.appbar{flex:0 0 103px; min-height:0; display:flex; align-items:center; justify-content:space-between;
        padding:0 var(--gutter) 14px}
/* min-height:0 keeps the bar at its measured 103px: the logo lockup is 94px
   tall and overhangs the 89px content box slightly, exactly as in the mock */
.appbar__logo{display:block; line-height:1}
.appbar__actions{display:flex; align-items:center; gap:34px}
.appbar__action{position:relative; display:block; color:var(--cream)}
.appbar__badge{position:absolute; top:-10px; right:-14px; min-width:30px; height:30px;
               padding:0 8px; border-radius:var(--r-pill); background:var(--rose);
               color:var(--cream); font-size:16px; font-weight:600; display:grid; place-items:center}

/* ---------- 6. SECTION HEADER ------------------------------------------- */
.section{padding:38px 0 0}
.section__head{display:flex; align-items:baseline; justify-content:space-between;
               padding:0 var(--gutter); margin-bottom:22px}
.section__link{display:inline-flex; align-items:center; gap:10px; font-size:19px; color:var(--rose-light)}

/* ---------- 7. BUTTONS + CHIPS ------------------------------------------ */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:16px;
     border-radius:var(--r-btn); padding:0 34px; height:64px}
.btn--primary{background:var(--rose); color:#fff}
.btn--outline{border:1px solid var(--line-strong); color:var(--cream)}
.btn--text{padding:0; height:auto; color:var(--rose-light)}
.btn--block{display:flex; width:100%}
.chip{display:inline-flex; align-items:center; height:42px; padding:0 20px;
      border-radius:var(--r-pill); font-size:16px}
.chip--member{background:var(--chip-bg); color:var(--rose-pale)}

/* ---------- 8. TAB BAR + HOME INDICATOR --------------------------------- */
.tabbar{flex:0 0 88px; margin-top:auto; display:flex; align-items:center;
        border-top:1px solid var(--line); background:var(--bg)}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:9px; color:var(--cream)}
.tab--active{color:var(--rose-light)}
.home-indicator{flex:0 0 44px; display:grid; place-items:center; background:var(--bg)}
.home-indicator::after{content:""; width:286px; height:10px; border-radius:5px; background:var(--cream)}

/* ==========================================================================
   SCREEN: SEARCH
   Left/right margin on this screen is 46px for the search field and 52–61px
   for the lists, NOT the 36px page gutter. All values measured.
   ========================================================================== */

/* BACK BAR — back arrow only, no title, no actions. Arrow box y 117–157. */
.search-nav{flex:0 0 143px; display:flex; align-items:flex-start; padding:47px 46px 0}
.search-nav__back{display:block; color:var(--rose-pale)}

/* SEARCH FIELD — stadium pill, 760 x 136 at x=46, y=213. 1px hairline
   border, faintly raised fill. Magnifier at x 91, placeholder text at x 179. */
.search-field{position:relative; margin:0 46px; height:136px;
              border:1px solid rgba(250,247,245,.16); border-radius:var(--r-pill);
              background:rgba(250,247,245,.045); display:flex; align-items:center;
              padding:0 46px}
.search-field__icon{flex:0 0 auto; color:var(--rose-pale); opacity:.85}
.search-field__input{flex:1; margin-left:39px; background:none; border:0; outline:0;
                     font-family:var(--font-sans); font-size:36px; font-weight:300;
                     color:var(--cream)}
.search-field__input::placeholder{color:#B9AFAA; font-weight:300}

/* LIST HEADING — sans, rose, "R" cap measured 32px => ~44px. */
.search-heading{font-size:44px; line-height:1.2; font-weight:400;
                color:var(--rose-light); margin:0; padding-left:52px}

/* SUGGESTION ROW — 80px circular icon badge at x=61, label at x=199.
   Row pitch measured 114px in Recent Searches and 119px in Trending. */
.search-list{margin:0; padding:0 46px 0 61px; display:flex; flex-direction:column; gap:34px}
.search-list--trending{gap:39px}
.search-row{display:flex; align-items:center; gap:58px; width:100%; text-align:left}
.search-row__badge{flex:0 0 80px; width:80px; height:80px; border-radius:var(--r-pill);
                   background:rgba(219,146,138,.09); color:var(--rose-pale);
                   display:grid; place-items:center}
.search-row__label{font-size:38px; line-height:1.15; font-weight:300; color:var(--cream)}
</style>
</head>
<body>

<!-- ICON: approximated, swap for production icon set -->

<div class="screen">

  <!-- ==================================================================
       STATUS BAR — iOS chrome drawn into the mock. Not app UI; delete this
       block when building the real screen.
       ================================================================== -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="statusbar__icons">
      <svg width="32" height="21" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="30" height="21" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.5 5.9 8.3a3 3 0 0 1 4.2 0L8 10.5Zm0-4.6a5.4 5.4 0 0 0-3.8 1.6L2.8 6.1a7.4 7.4 0 0 1 10.4 0l-1.4 1.4A5.4 5.4 0 0 0 8 5.9Zm0-3.8a9.2 9.2 0 0 0-6.5 2.7L.1 3.4a11.2 11.2 0 0 1 15.8 0l-1.4 1.4A9.2 9.2 0 0 0 8 2.1Z"/></svg>
      <svg width="46" height="22" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".5"/></svg>
    </span>
  </div>

  <!-- ==================================================================
       BACK BAR — a bare back arrow in rose-pale at x=53, y=117. No title
       and no right-hand action on this screen (unlike the .navbar used on
       C07 / C10 etc.).
       ================================================================== -->
  <nav class="search-nav">
    <button class="search-nav__back" type="button" aria-label="Back">
      <svg width="42" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4"/><path d="m10 6-6 6 6 6"/></svg>
    </button>
  </nav>

  <!-- ==================================================================
       SEARCH FIELD — 760 x 136 pill, y 213–349. Magnifier icon then
       placeholder "Search houses, objects, rituals…".
       Empty state: no typed value, no clear (x) button, no cancel action.
       ================================================================== -->
  <form class="search-field" role="search" onsubmit="return false">
    <span class="search-field__icon" aria-hidden="true">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/></svg>
    </span>
    <label class="search-field__label" for="q" hidden>Search</label>
    <input class="search-field__input" id="q" type="search" name="q"
           placeholder="Search houses, objects, rituals...">
  </form>

  <!-- ==================================================================
       SECTION: "Recent Searches" — heading baseline y 485, then 4 rows.
       Each row: 80px circular icon badge (x 61–141) + label (x 199).
       Row centres measured at y 587 / 702 / 817 / 931 (114px pitch).
       DEVIATION-RISK: recent searches have no per-row remove control and
       there is no "Clear all" action anywhere on the screen, so a user can
       never delete a past query. Add an x per row or a Clear link.
       DEVIATION-RISK: the leading icons do not match the entries — "Linen
       sheets" and "Nepal" both carry a person/avatar glyph and "Copper
       vessel" carries a tag. A recent-search list should use one repeated
       glyph (a clock or a magnifier), or a glyph that maps to the result
       type. Confirm the intended mapping before build.
       ================================================================== -->
  <h2 class="search-heading" style="margin-top:88px">Recent Searches</h2>

  <ul class="search-list" style="margin-top:57px">
    <li>
      <button class="search-row" type="button">
        <span class="search-row__badge" aria-hidden="true">
          <!-- tag / label glyph -->
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12.6 3H20a1 1 0 0 1 1 1v7.4a2 2 0 0 1-.6 1.4l-7.6 7.6a2 2 0 0 1-2.8 0l-6-6a2 2 0 0 1 0-2.8l7.6-7.6A2 2 0 0 1 12.6 3Z"/><circle cx="16.5" cy="7.5" r="1.4"/></svg>
        </span>
        <span class="search-row__label">Copper vessel</span>
      </button>
    </li>
    <li>
      <button class="search-row" type="button">
        <span class="search-row__badge" aria-hidden="true">
          <!-- person glyph -->
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8" r="4"/><path d="M4.8 20.5a7.2 7.2 0 0 1 14.4 0"/></svg>
        </span>
        <span class="search-row__label">Linen sheets</span>
      </button>
    </li>
    <li>
      <button class="search-row" type="button">
        <span class="search-row__badge" aria-hidden="true">
          <!-- person glyph (same as row 2 in the mock) -->
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8" r="4"/><path d="M4.8 20.5a7.2 7.2 0 0 1 14.4 0"/></svg>
        </span>
        <span class="search-row__label">Nepal</span>
      </button>
    </li>
    <li>
      <button class="search-row" type="button">
        <span class="search-row__badge" aria-hidden="true">
          <!-- clock glyph -->
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.4 2"/></svg>
        </span>
        <span class="search-row__label">Beeswax candle</span>
      </button>
    </li>
  </ul>

  <!-- ==================================================================
       SECTION: "Trending" — heading at y 1070, then 4 rows.
       Row centres measured at y 1203 / 1323 / 1442 / 1560 (119px pitch —
       5px looser than the Recent Searches list above; probably unintended,
       worth normalising to one row height).
       ================================================================== -->
  <h2 class="search-heading" style="margin-top:83px">Trending</h2>

  <ul class="search-list search-list--trending" style="margin-top:56px">
    <li>
      <button class="search-row" type="button">
        <span class="search-row__badge" aria-hidden="true">
          <!-- shopping bag with handle -->
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6.4a3 3 0 0 1 6 0V8"/></svg>
        </span>
        <span class="search-row__label">Gifts for home</span>
      </button>
    </li>
    <li>
      <button class="search-row" type="button">
        <span class="search-row__badge" aria-hidden="true">
          <!-- flat bag / case glyph -->
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="5" y="8" width="14" height="12" rx="2"/><path d="M9 8V6.4a3 3 0 0 1 6 0V8"/><path d="M10 14h4"/></svg>
        </span>
        <span class="search-row__label">Objects from Nepal</span>
      </button>
    </li>
    <li>
      <button class="search-row" type="button">
        <span class="search-row__badge" aria-hidden="true">
          <!-- magnifier glyph -->
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/></svg>
        </span>
        <span class="search-row__label">Tableware</span>
      </button>
    </li>
    <li>
      <button class="search-row" type="button">
        <span class="search-row__badge" aria-hidden="true">
          <!-- rounded square containing a lotus / leaf -->
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 16c-2.2 0-3.6-1.5-3.6-3.6 1.4 0 2.5.5 3.6 1.8 1.1-1.3 2.2-1.8 3.6-1.8 0 2.1-1.4 3.6-3.6 3.6Z"/><path d="M12 14V8.4"/></svg>
        </span>
        <span class="search-row__label">Wellness</span>
      </button>
    </li>
  </ul>

  <!-- ==================================================================
       DEVIATION-RISK: below the last Trending row (bottom edge y 1600)
       there is ~200px of empty screen and no tab bar — Search is reached
       from the Home app bar, so it has no way back to Shop / Wishlist / Me
       except the back arrow. Either add the tab bar or confirm Search is a
       full-screen modal.
       ================================================================== -->

  <!-- HOME INDICATOR — iOS chrome. -->
  <div class="home-indicator" style="margin-top:auto"></div>

</div>
</body>
</html>
